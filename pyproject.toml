[project]
name = "tasks-api"
version = "0.1.0"
description = "REST API for task management (MVP)"
requires-python = ">=3.14"
dependencies = [
    "alembic~=1.20",
    "fastapi~=0.143.3",
    "pydantic~=2.14",
    "pydantic-settings~=2.16",
    "sqlmodel~=0.0.48",
    "structlog~=26.1",
    "uvicorn[standard]~=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2~=2.13.1",
    "mypy~=2.4",
    "pytest~=9.1",
    "pytest-cov~=7.1",
    "pytest-randomly~=5.0",
    "ruff~=0.17.1",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["."]

[tool.ruff.lint]
preview = true
explicit-preview-rules = true
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
    "PTH",  # use pathlib instead of os.path (portability, RT12)
    "S602", # subprocess call with shell=True (portability, RT12)
    "S605", # starting a process with a shell (portability, RT12)
    "S607", # starting a process with a partial path (portability, RT12)
    "PLW1514", # open() without explicit encoding (portability, RT12; preview rule)
]
# FastAPI declares dependencies as call expressions in default arguments.
ignore = ["B008"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
python_version = "3.14"
files = ["app"]
strict = true
plugins = ["pydantic.mypy"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --strict-config"
filterwarnings = ["error"]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_empty = true
exclude_also = [
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
