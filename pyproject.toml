[project]
name = "tasks-api"
version = "0.1.0"
description = "REST API for task management (MVP)"
requires-python = ">=3.14"
dependencies = [
    "alembic~=1.20",
    "fastapi~=0.143.3",
    "pydantic~=2.14",
    "pydantic-settings~=2.16",
    "sqlmodel~=0.0.48",
    "structlog~=26.1",
    "uvicorn[standard]~=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2~=2.13.1",
    "mypy~=2.4",
    "pytest~=9.1",
    "pytest-cov~=7.1",
    "ruff~=0.17.1",
]
